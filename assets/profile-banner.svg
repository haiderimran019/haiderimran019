<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" role="img" aria-labelledby="title desc">
  <title id="title">Haider Imran — Aspiring AI Engineer</title>
  <desc id="desc">Minimal midnight-blue and violet portfolio banner with geometric lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1022"/>
      <stop offset="58%" stop-color="#10182E"/>
      <stop offset="100%" stop-color="#192449"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B8CFF"/>
      <stop offset="100%" stop-color="#B19CFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B7C2FF" stroke-width=".6" opacity=".12"/>
    </pattern>
    <clipPath id="clip"><rect width="960" height="236" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
