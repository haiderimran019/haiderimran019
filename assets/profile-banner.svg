    <rect width="960" height="236" fill="url(#grid)"/>
    <rect x="0" y="0" width="6" height="236" fill="url(#accent)"/>
    <circle cx="825" cy="114" r="138" fill="none" stroke="#7186F9" stroke-opacity=".19" stroke-width="1.25"/>
    <circle cx="825" cy="114" r="92" fill="none" stroke="#9A8FFF" stroke-opacity=".28" stroke-width="1.25"/>
    <circle cx="825" cy="114" r="45" fill="none" stroke="#C1BAFF" stroke-opacity=".38" stroke-width="1.25"/>
    <path d="M680 46 L765 71 L826 114 L910 62 M744 186 L826 114 L927 178" stroke="#A1A8FF" stroke-opacity=".37" stroke-width="1.2" fill="none"/>
    <g fill="#B7B7FF"><circle cx="680" cy="46" r="3"/><circle cx="765" cy="71" r="3"/><circle cx="826" cy="114" r="4"/><circle cx="910" cy="62" r="3"/><circle cx="744" cy="186" r="3"/><circle cx="927" cy="178" r="3"/></g>
    <rect x="54" y="39" width="6" height="6" rx="1" fill="#A998FF"/>
    <text x="73" y="46" fill="#A9B7D4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5">PORTFOLIO / ENGINEERING</text>
    <text x="53" y="126" fill="#F7F8FF" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.8">Haider Imran</text>
    <rect x="54" y="150" width="47" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="54" y="187" fill="#CCD5F0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" letter-spacing="1">ASPIRING AI ENGINEER  /  DATA SCIENCE</text>
